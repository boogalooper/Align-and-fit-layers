<line x1="712" y1="546.0000" x2="850" y2="546.0000" stroke="#4d9966" stroke-width="2"/>
<line x1="712" y1="598.2500" x2="850" y2="598.2500" stroke="#3399e6" stroke-width="2"/>
<rect x="711" y="508" width="140" height="190" fill="none" stroke="#437d7a" stroke-width="1.5"/>
<text x="781" y="728" text-anchor="middle" class="note">Лицо ниже, размер тот же</text>
<text x="24" y="778" class="note">Схема показывает действие настроек. При обработке нескольких портретов скрипт согласует лица.</text>
<text x="24" y="802" class="small">Для общей линии глаз и перекрытия рамки фактический отступ может быть больше заданного.</text>
