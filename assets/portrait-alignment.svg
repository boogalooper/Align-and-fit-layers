<svg xmlns="http://www.w3.org/2000/svg" width="950" height="460" viewBox="0 0 950 460" role="img" aria-labelledby="title desc">
<title id="title">Одинаковая крупность портретов и согласованная линия глаз</title>
<desc id="desc">Слева лица разного размера и на разной высоте. Справа лица согласованы по крупности, а середины глаз находятся на 35 процентах высоты рамок. Если один исходник требует большего увеличения, крупность корректируется совместно.</desc>
