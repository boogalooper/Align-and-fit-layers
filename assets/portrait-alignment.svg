<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="950" height="820" viewBox="0 0 950 820" role="img" aria-labelledby="title desc">
<title id="title">Масштаб и отступ над головой в портретном режиме</title>
<desc id="desc">На портрете из окна скрипта показаны три значения масштаба при одинаковом верхнем отступе и три значения отступа при одинаковом масштабе. Зелёная линия обозначает минимальный верхний отступ, синяя — положение глаз. Рамки остаются неподвижными.</desc>
<defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#303940}.heading{font-size:21px;font-weight:bold}.label{font-size:17px;font-weight:bold}.note{font-size:15px}.small{font-size:14px;fill:#637278}</style>

<image id="portrait" width="160" height="240" xlink:href="data:image/png;base64,"/>
</defs>
<rect width="950" height="820" rx="12" fill="#f6f7f9"/>
<text x="24" y="36" class="heading">Портретный режим: масштаб и отступ над головой</text>
<line x1="25" y1="62" x2="55" y2="62" stroke="#4d9966" stroke-width="2"/>
<text x="65" y="67" class="note">минимальный отступ</text>
<line x1="287" y1="62" x2="317" y2="62" stroke="#3399e6" stroke-width="2"/>
<text x="327" y="67" class="note">линия глаз</text>
