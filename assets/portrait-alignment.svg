<text x="45" y="378" class="note" font-weight="bold">Если исходное кадрирование требует большей крупности — увеличиваются все портреты.</text>
<text x="45" y="403" class="note">Линия глаз подбирается с учётом отдельного минимального отступа над головой.</text>
<text x="45" y="426" class="label">Схема показывает принцип. Наклон головы и естественные пропорции лиц сохраняются.</text>
