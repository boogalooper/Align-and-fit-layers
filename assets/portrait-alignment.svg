<text x="238" y="304" text-anchor="middle" class="label">Размер лица и высота глаз различаются</text>
<text x="712" y="290" text-anchor="middle" class="label">Общая линия глаз — автоматически</text>
<text x="712" y="312" text-anchor="middle" class="label">Крупность задаётся одним ползунком</text>
